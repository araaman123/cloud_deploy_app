"""CI/CD workflow for building and deploying applications."""

name: Deploy Application

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  detect-and-build:
    name: Detect App Type & Build Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      app-type: ${{ steps.detect.outputs.app-type }}
      image-uri: ${{ steps.build.outputs.image-uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Detect application type
        id: detect
        run: |
          if [ -f "requirements.txt" ] || [ -f "Pipfile" ] || [ -f "pyproject.toml" ]; then
            echo "app-type=python" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "app-type=node" >> $GITHUB_OUTPUT
          elif [ -f "index.html" ]; then
            echo "app-type=static" >> $GITHUB_OUTPUT
          else
            echo "app-type=unknown" >> $GITHUB_OUTPUT
          fi
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}
      
      - name: Build Docker image
        id: build
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}
          docker build -t $IMAGE_URI -f Dockerfile .
          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
      
      - name: Push to ECR
        run: docker push ${{ steps.build.outputs.image-uri }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: detect-and-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name cloud-deploy-eks \
            --region ${{ env.AWS_REGION }}
      
      - name: Deploy to EKS
        run: |
          NAMESPACE=app-${{ github.run_id }}
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Generate and apply manifests
          python -m kubernetes.templates generate_deployment \
            --app-name "${{ github.event.repository.name }}" \
            --namespace "$NAMESPACE" \
            --image-uri "${{ needs.detect-and-build.outputs.image-uri }}" \
            --app-type "${{ needs.detect-and-build.outputs.app-type }}"
          
          kubectl apply -f deployment.yaml -n $NAMESPACE
          kubectl apply -f service.yaml -n $NAMESPACE
          kubectl apply -f ingress.yaml -n $NAMESPACE
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ github.event.repository.name }} \
            -n app-${{ github.run_id }} \
            --timeout=5m
      
      - name: Get service info
        run: |
          kubectl get all -n app-${{ github.run_id }}
          kubectl get ingress -n app-${{ github.run_id }}
      
      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Namespace: app-${{ github.run_id }}"
          echo "Image: ${{ needs.detect-and-build.outputs.image-uri }}"
